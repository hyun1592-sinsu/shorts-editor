<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 목소리 스튜디오</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e1dc;
    --accent: #2f6fde; --rec: #e0383e; --ok: #1f9d55; --warn: #c27c0e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --panel: #1f1f22; --text: #f2f2f4; --muted: #9a9aa1; --line: #333338;
      --accent: #5b8ff0; --rec: #ff5a5f; --ok: #3cc47c; --warn: #e5a23a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  nav.tabs { display: flex; gap: 4px; padding: 10px 24px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
  nav.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 10px 16px 12px;
    font-size: 16px; font-weight: 600; color: var(--muted); }
  nav.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  [hidden] { display: none !important; }
  .app { display: grid; grid-template-columns: 1fr 320px; min-height: calc(100vh - 52px); }

  .gen { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.2fr); gap: 24px; padding: 28px 40px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .panel h2 { margin: 0; font-size: 18px; }
  #genText { width: 100%; min-height: 260px; resize: vertical; font: inherit; font-size: 17px; line-height: 1.6; padding: 14px 16px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #genText:focus { outline: none; border-color: var(--accent); }
  .slider { display: grid; grid-template-columns: 70px 1fr 64px auto; gap: 12px; align-items: center; font-size: 15px; }
  .slider input { width: 100%; accent-color: var(--accent); }
  .slider output { font-variant-numeric: tabular-nums; text-align: right; }
  .slider button { padding: 4px 10px; font-size: 13px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 14px; font-size: 14px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }
  .slider select { max-width: none; width: 100%; margin: 0; }
  details.lex summary { cursor: pointer; font-size: 15px; }
  details.lex textarea { width: 100%; min-height: 140px; margin: 10px 0 8px; font: inherit; font-size: 14px; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); resize: vertical; }
  .warn-en { color: var(--warn); }
  button.go { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; font-size: 16px; padding: 12px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar label { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
  .items { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 260px); overflow-y: auto; }
  .gi { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
  .gi.new { border-color: var(--accent); }
  .gi .txt { font-size: 15px; line-height: 1.45; word-break: keep-all; }
  .gi .meta { font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .gi .meta .err { color: var(--rec); }
  .gi .acts { display: flex; gap: 6px; }
  .gi .acts button { padding: 6px 10px; font-size: 14px; }
  .gi input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .note { font-size: 13px; color: var(--muted); }
  main { padding: 28px 40px; display: flex; flex-direction: column; gap: 20px; }
  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; max-height: 100vh; position: sticky; top: 0; }

  .stats { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
  .stat .k { font-size: 13px; color: var(--muted); }
  .stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .goal { flex: 1; min-width: 220px; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .bar.done > div { background: var(--ok); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 36px 44px;
    flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; min-height: 340px; }
  .card.recording { border-color: var(--rec); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rec) 25%, transparent); }
  .pos { color: var(--muted); font-size: 15px; display: flex; gap: 12px; align-items: center; }
  .badge { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--line); color: var(--muted); }
  .badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .badge.rec { background: var(--rec); color: #fff; }
  .sentence { font-size: clamp(28px, 3.6vw, 46px); line-height: 1.45; font-weight: 600; word-break: keep-all; }
  textarea.sentence { width: 100%; resize: vertical; min-height: 140px; background: var(--bg); color: var(--text);
    border: 2px solid var(--accent); border-radius: 12px; padding: 12px 16px; font-family: inherit; }
  .meter { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; visibility: hidden; }
  .recording .meter { visibility: visible; }
  .meter > div { height: 100%; width: 0; background: var(--rec); transition: width 60ms; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; font-size: 15px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); cursor: pointer; }
  select { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); max-width: 260px; margin-top: 4px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--rec); border-color: var(--rec); color: #fff; font-weight: 700; min-width: 150px; }
  kbd { font-family: inherit; font-size: 12px; padding: 1px 6px; border: 1px solid currentColor; border-radius: 5px; opacity: .7; margin-left: 6px; }
  .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 14px; }
  .msg { min-height: 20px; font-size: 14px; color: var(--warn); }

  aside h2 { font-size: 15px; margin: 0; padding: 18px 18px 10px; }
  .list { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
  .item { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; align-items: start; }
  .item:hover { background: var(--bg); }
  .item.cur { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .item .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .item .t { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .item .d { color: var(--ok); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item .d.warn { color: var(--warn); }
  .asidefoot { padding: 12px; border-top: 1px solid var(--line); }
  .asidefoot button { width: 100%; }

  @media (max-width: 860px) {
    .app, .gen { grid-template-columns: 1fr; }
    .gen { padding: 16px; }
    nav.tabs { padding: 6px 8px 0; }
    main { padding: 16px; }
    .card { padding: 24px 20px; }
    aside { position: static; max-height: 50vh; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<nav class="tabs">
  <button data-tab="gen">음성 만들기</button>
  <button data-tab="rec">녹음하기</button>
</nav>

<div class="gen" id="genView" hidden>
  <section class="panel">
    <h2>글 입력</h2>
    <textarea id="genText" placeholder="여기에 글을 넣으세요.&#10;엔터로 줄을 나누면 줄마다 파일이 하나씩 만들어집니다."></textarea>
    <div class="note" id="lineInfo">0줄 → 파일 0개</div>
    <div class="slider"><span>속도</span><input type="range" id="speed" min="0.8" max="1.3" step="0.01" value="1.05"><output id="speedOut">1.05배</output><button data-reset="speed">기본</button></div>
    <div class="slider"><span>높낮이</span><input type="range" id="pitch" min="-6" max="6" step="0.5" value="0"><output id="pitchOut">0</output><button data-reset="pitch">기본</button></div>
    <div class="slider"><span>문장 사이</span><input type="range" id="gap" min="0.05" max="0.6" step="0.05" value="0.25"><output id="gapOut">0.25초</output><button data-reset="gap">기본</button></div>
    <div class="slider"><span>억양</span>
      <div class="seg" id="style"><button data-v="calm">차분</button><button data-v="normal">보통</button><button data-v="rich">풍부</button></div>
      <span></span><span></span></div>
    <div class="slider"><span>목소리</span><select id="voice"></select><span></span><span></span></div>
    <div class="toolbar">
      <label><input type="checkbox" id="denoise" checked> 잡음 제거</label>
      <label><input type="checkbox" id="calm_exclaim" checked> 느낌표를 자연스럽게 읽기</label>
    </div>
    <details class="lex">
      <summary>읽기 사전 <span class="note">— 영어·약어를 한글 발음으로 바꿔 읽어요</span></summary>
      <textarea id="lexText" spellcheck="false" placeholder="YouTube = 유튜브"></textarea>
      <div class="toolbar"><span class="note">한 줄에 하나씩 “원래 글자 = 읽는 법”</span><span class="spacer"></span><button id="lexSave">사전 저장</button></div>
    </details>
    <button class="go" id="genBtn">🎙 음성 만들기 <kbd>Ctrl+Enter</kbd></button>
    <div class="note" id="modelInfo"></div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <label><input type="checkbox" id="selAll"> 전체 선택</label>
      <span class="spacer"></span>
      <label><input type="checkbox" id="autoPlay" checked> 완성되면 바로 재생</label>
      <button id="saveSel" disabled>⬇ 선택 저장</button>
      <button id="delSel" disabled>선택 삭제</button>
    </div>
    <div class="items" id="items"></div>
  </section>
</div>

<div class="app" id="recView" hidden>
  <main>
    <div class="stats">
      <div class="stat"><div class="k">녹음한 문장</div><div class="v" id="count">0 / 0</div></div>
      <div class="stat"><div class="k">총 길이</div><div class="v" id="total">0:00</div></div>
      <div class="stat goal">
        <div class="k" id="goalText">목표 3:00까지 3:00 남음</div>
        <div class="bar" id="bar"><div></div></div>
      </div>
      <div class="stat"><div class="k">마이크</div><select id="mic"><option value="">기본 마이크</option></select></div>
    </div>

    <div class="card" id="card">
      <div class="pos"><span id="pos">1 / 40</span><span class="badge" id="badge">미녹음</span><span id="timer"></span></div>
      <div class="sentence" id="sentence"></div>
      <div class="meter"><div id="meter"></div></div>
      <div class="controls">
        <button class="primary" id="recBtn">● 녹음<kbd>Space</kbd></button>
        <button id="playBtn" disabled>▶ 다시 듣기<kbd>Enter</kbd></button>
        <button id="redoBtn" disabled>↻ 다시 녹음<kbd>R</kbd></button>
        <span class="spacer"></span>
        <button id="prevBtn">← 이전</button>
        <button id="nextBtn">다음 →</button>
      </div>
      <div class="controls">
        <button id="editBtn">✎ 문장 고치기<kbd>E</kbd></button>
        <button id="addBtn">＋ 문장 추가</button>
        <button id="delBtn">문장 삭제</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="hint">Space 녹음 시작/정지 · Enter 다시 듣기 · R 다시 녹음 · ←/→ 이전/다음 · E 문장 고치기 (고치는 중엔 Enter 저장, Esc 취소)</div>
  </main>

  <aside>
    <h2>문장 목록</h2>
    <div class="list" id="list"></div>
    <div class="asidefoot"><button id="addEndBtn">＋ 맨 끝에 문장 추가</button></div>
  </aside>
</div>

<script>
const GOAL = 180;
const $ = id => document.getElementById(id);
let sentences = [], recs = {}, cur = 0;
let rec = null;          // active recording session
let editing = false;
let player = null;

const fmt = s => { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const say = t => { $("msg").textContent = t || ""; };

async function api(method, url, body, isJson = true) {
  const r = await fetch(url, { method, body: isJson && body !== undefined ? JSON.stringify(body) : body,
    headers: isJson && body !== undefined ? { "Content-Type": "application/json" } : {} });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

async function load() {
  const s = await api("GET", "/api/state");
  sentences = s.sentences; recs = s.recordings;
  render();
}

function saveSentences() { return api("PUT", "/api/sentences", sentences); }

function render() {
  const s = sentences[cur];
  const r = s && recs[s.id];
  const stale = r && r.text && r.text !== s.text;
  $("pos").textContent = sentences.length ? `${cur + 1} / ${sentences.length}` : "문장 없음";
  if (!editing) $("sentence").textContent = s ? s.text : "문장을 추가해 주세요.";

  const b = $("badge");
  if (rec) { b.className = "badge rec"; b.textContent = "녹음 중"; }
  else if (stale) { b.className = "badge warn"; b.textContent = `문장이 바뀜 · 다시 녹음 필요`; }
  else if (r) { b.className = "badge ok"; b.textContent = `녹음됨 ${r.duration.toFixed(1)}초`; }
  else { b.className = "badge"; b.textContent = "미녹음"; }

  $("card").classList.toggle("recording", !!rec);
  $("recBtn").innerHTML = rec ? "■ 정지<kbd>Space</kbd>" : "● 녹음<kbd>Space</kbd>";
  $("recBtn").disabled = !s || editing;
  $("playBtn").disabled = !r || !!rec || editing;
  $("redoBtn").disabled = !r || !!rec || editing;
  $("prevBtn").disabled = cur <= 0 || !!rec;
  $("nextBtn").disabled = cur >= sentences.length - 1 || !!rec;
  for (const id of ["editBtn", "addBtn", "delBtn", "addEndBtn"]) $(id).disabled = !!rec;
  $("delBtn").disabled = !!rec || !s;
  $("editBtn").innerHTML = editing ? "✓ 저장<kbd>Enter</kbd>" : "✎ 문장 고치기<kbd>E</kbd>";

  const ids = new Set(sentences.map(x => x.id));
  const done = Object.entries(recs).filter(([id]) => ids.has(id));
  const total = done.reduce((a, [, x]) => a + x.duration, 0);
  $("count").textContent = `${done.length} / ${sentences.length}`;
  $("total").textContent = fmt(total);
  $("goalText").textContent = total >= GOAL ? "목표 3:00 달성! 🎉" : `목표 3:00까지 ${fmt(GOAL - total)} 남음`;
  $("bar").firstElementChild.style.width = `${Math.min(100, total / GOAL * 100)}%`;
  $("bar").classList.toggle("done", total >= GOAL);

  const list = $("list");
  list.innerHTML = "";
  sentences.forEach((x, i) => {
    const rr = recs[x.id], st = rr && rr.text && rr.text !== x.text;
    const el = document.createElement("div");
    el.className = "item" + (i === cur ? " cur" : "");
    el.innerHTML = `<span class="n">${i + 1}</span><span class="t"></span><span class="d${st ? " warn" : ""}">${rr ? (st ? "⚠ " : "✓ ") + rr.duration.toFixed(1) + "s" : ""}</span>`;
    el.querySelector(".t").textContent = x.text;
    el.onclick = () => { if (!rec && !editing) go(i); };
    list.appendChild(el);
  });
  list.children[cur]?.scrollIntoView({ block: "nearest" });
}

function go(i) {
  if (i < 0 || i >= sentences.length) return;
  stopPlay(); cur = i; say(""); render();
}

// ---- recording: raw PCM via AudioWorklet -> 16-bit mono WAV ----
let stream = null, ctx = null;
const WORKLET = `class Cap extends AudioWorkletProcessor {
  process(inputs) { const c = inputs[0][0]; if (c) this.port.postMessage(c.slice(0)); return true; }
} registerProcessor("cap", Cap);`;

async function ensureMic() {
  if (stream) return;
  const deviceId = $("mic").value;
  stream = await navigator.mediaDevices.getUserMedia({ audio: {
    channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false,
    ...(deviceId ? { deviceId: { exact: deviceId } } : {}) } });
  if (!ctx) {
    ctx = new AudioContext();
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" })));
  }
  listMics();  // labels only become visible after permission is granted
}

async function listMics() {
  const sel = $("mic");
  let saved = null; try { saved = localStorage.getItem("mic"); } catch {}
  const keep = sel.value || saved || "";
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput" && d.deviceId !== "default" && d.deviceId !== "communications");
  sel.innerHTML = '<option value="">기본 마이크</option>';
  devs.forEach((d, i) => { const o = document.createElement("option"); o.value = d.deviceId; o.textContent = d.label || `마이크 ${i + 1}`; sel.appendChild(o); });
  if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
}

$("mic").addEventListener("change", e => {
  try { localStorage.setItem("mic", e.target.value); } catch {}
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  e.target.blur();
});
listMics();

async function startRec() {
  if (rec || editing || !sentences[cur]) return;
  stopPlay();
  try { await ensureMic(); }
  catch (e) { say("마이크를 쓸 수 없어요. 브라우저 주소창 왼쪽에서 마이크 권한을 허용해 주세요."); return; }
  await ctx.resume();
  const src = ctx.createMediaStreamSource(stream);
  const node = new AudioWorkletNode(ctx, "cap");
  const chunks = [];
  const t0 = performance.now();
  node.port.onmessage = e => {
    chunks.push(e.data);
    let peak = 0; for (const v of e.data) peak = Math.max(peak, Math.abs(v));
    $("meter").style.width = `${Math.min(100, peak * 140)}%`;
  };
  src.connect(node);
  const tick = setInterval(() => { $("timer").textContent = `${((performance.now() - t0) / 1000).toFixed(1)}초`; }, 100);
  rec = { src, node, chunks, tick, id: sentences[cur].id };
  say(""); render();
}

async function stopRec() {
  if (!rec) return;
  const r = rec; rec = null;
  r.src.disconnect(); r.node.disconnect(); clearInterval(r.tick);
  $("timer").textContent = ""; $("meter").style.width = "0";
  const n = r.chunks.reduce((a, c) => a + c.length, 0);
  if (n / ctx.sampleRate < 0.6) { say("너무 짧아서 저장하지 않았어요. 다시 녹음해 주세요."); render(); return; }
  const pcm = new Float32Array(n); let o = 0;
  for (const c of r.chunks) { pcm.set(c, o); o += c.length; }
  let peak = 0; for (const v of pcm) peak = Math.max(peak, Math.abs(v));
  try {
    recs[r.id] = await api("POST", `/api/recordings/${r.id}`, encodeWav(pcm, ctx.sampleRate), false);
    if (peak > 0.98) say("소리가 너무 커서 찢어졌을 수 있어요. 마이크에서 조금 떨어져서 다시 녹음해 보세요.");
    else if (peak < 0.05) say("소리가 너무 작아요. 마이크에 조금 가까이 가서 다시 녹음해 보세요.");
  } catch (e) { say("저장 실패: " + e.message); }
  render();
}

function encodeWav(pcm, rate) {
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) { const s = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([buf], { type: "audio/wav" });
}

function toggleRec() { rec ? stopRec() : startRec(); }

function play() {
  const s = sentences[cur];
  if (!s || !recs[s.id] || rec) return;
  stopPlay();
  player = new Audio(`/api/recordings/${s.id}?t=${Date.now()}`);
  player.play();
}
function stopPlay() { if (player) { player.pause(); player = null; } }

// ---- editing sentences ----
function startEdit() {
  if (rec || !sentences[cur]) return;
  editing = true;
  const ta = document.createElement("textarea");
  ta.className = "sentence"; ta.id = "sentence"; ta.value = sentences[cur].text;
  ta.onkeydown = e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); finishEdit(true); }
    if (e.key === "Escape") { e.preventDefault(); finishEdit(false); }
  };
  $("sentence").replaceWith(ta); ta.focus(); ta.select();
  render();
}

async function finishEdit(save) {
  if (!editing) return;
  const ta = $("sentence"), text = ta.value.trim();
  editing = false;
  const div = document.createElement("div"); div.className = "sentence"; div.id = "sentence";
  ta.replaceWith(div);
  if (save && text && text !== sentences[cur].text) {
    sentences[cur].text = text;
    try { await saveSentences(); if (recs[sentences[cur].id]) say("문장을 고쳤어요. 녹음과 내용이 달라졌으니 다시 녹음해 주세요."); }
    catch (e) { say("저장 실패: " + e.message); }
  } else if (save && !text) say("빈 문장은 저장할 수 없어요.");
  render();
}

async function addSentence(at) {
  if (rec) return;
  if (editing) await finishEdit(true);
  const id = crypto.randomUUID().replace(/-/g, "").slice(0, 8);
  sentences.splice(at, 0, { id, text: "새 문장을 입력하세요." });
  await saveSentences();
  cur = at; render(); startEdit();
}

async function deleteSentence() {
  const s = sentences[cur];
  if (!s || rec) return;
  if (!confirm(`이 문장을 삭제할까요?${recs[s.id] ? "\n녹음 파일도 함께 지워집니다." : ""}\n\n${s.text}`)) return;
  if (editing) { editing = false; const div = document.createElement("div"); div.className = "sentence"; div.id = "sentence"; $("sentence").replaceWith(div); }
  if (recs[s.id]) { await api("DELETE", `/api/recordings/${s.id}`); delete recs[s.id]; }
  sentences.splice(cur, 1);
  await saveSentences();
  cur = Math.min(cur, sentences.length - 1); if (cur < 0) cur = 0;
  render();
}

// ---- wiring ----
const click = (id, fn) => $(id).addEventListener("click", e => { e.currentTarget.blur(); fn(); });
click("recBtn", toggleRec);
click("playBtn", play);
click("redoBtn", startRec);
click("prevBtn", () => go(cur - 1));
click("nextBtn", () => go(cur + 1));
click("editBtn", () => editing ? finishEdit(true) : startEdit());
click("addBtn", () => addSentence(cur + 1));
click("addEndBtn", () => addSentence(sentences.length));
click("delBtn", deleteSentence);

document.addEventListener("keydown", e => {
  if (tab !== "rec" || editing || e.target.closest("textarea, input, select") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat) toggleRec(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); if (!rec) go(cur + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); if (!rec) go(cur - 1); }
  else if (e.key === "Enter") { e.preventDefault(); play(); }
  else if (e.key === "r" || e.key === "R" || e.key === "ㄱ") { e.preventDefault(); startRec(); }
  else if (e.key === "e" || e.key === "E" || e.key === "ㄷ") { e.preventDefault(); startEdit(); }
});

load().catch(e => say("서버에 연결할 수 없어요: " + e.message));

// ---- tabs ----
let tab = "gen";
function showTab(t) {
  if (rec) return;  // don't leave the recorder mid-take
  tab = t;
  $("genView").hidden = t !== "gen";
  $("recView").hidden = t !== "rec";
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  if (t !== "rec") stopPlay();
  try { localStorage.setItem("tab", t); } catch {}
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => { b.blur(); showTab(b.dataset.tab); }));
try { showTab(localStorage.getItem("tab") || "gen"); } catch { showTab("gen"); }

// ---- 음성 만들기 ----
let genItems = [], selected = new Set(), seen = null, genPlayer = null, pollTimer = null;
const playQueue = [];
const DEFAULTS = { speed: 1.05, pitch: 0, gap: 0.25 };
const STYLE_NAMES = { calm: "차분", normal: "보통", rich: "풍부" };

function pref(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch {} }
for (const k of ["speed", "pitch", "gap"]) {
  const saved = pref(k); if (saved !== null && saved !== undefined) $(k).value = saved;
  $(k).addEventListener("input", () => { pref(k, $(k).value); sliderLabels(); });
}
document.querySelectorAll("[data-reset]").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.reset; $(k).value = DEFAULTS[k]; pref(k, $(k).value); sliderLabels();
}));
function sliderLabels() {
  $("speedOut").textContent = `${(+$("speed").value).toFixed(2)}배`;
  const p = +$("pitch").value;
  $("pitchOut").textContent = p === 0 ? "0" : `${p > 0 ? "+" : ""}${p}반음`;
  $("gapOut").textContent = `${(+$("gap").value).toFixed(2)}초`;
}
sliderLabels();
for (const k of ["autoPlay", "denoise", "calm_exclaim"]) {
  const v = pref(k); if (v === "0" || v === "1") $(k).checked = v === "1";
  $(k).addEventListener("change", e => pref(k, e.target.checked ? "1" : "0"));
}

let style = pref("style") || "normal";
function renderStyle() { document.querySelectorAll("#style button").forEach(b => b.classList.toggle("on", b.dataset.v === style)); }
document.querySelectorAll("#style button").forEach(b => b.addEventListener("click", () => { style = b.dataset.v; pref("style", style); renderStyle(); }));
renderStyle();

async function loadVoices() {
  const { voices } = await api("GET", "/api/tts/voices");
  const sel = $("voice"), want = sel.value || pref("voice") || "A";
  sel.innerHTML = "";
  for (const v of voices) { const o = document.createElement("option"); o.value = v.id; o.textContent = v.label; sel.appendChild(o); }
  sel.value = voices.some(v => v.id === want) ? want : "A";
}
$("voice").addEventListener("change", e => pref("voice", e.target.value));
function voiceLabel(id) {
  const o = [...$("voice").options].find(o => o.value === id);
  return "목소리 " + (o ? o.textContent.replace(/^녹음: /, "").slice(0, 14) + "…" : id);
}
$("voice").addEventListener("focus", () => loadVoices().catch(() => {}));  // pick up new recordings
loadVoices().catch(() => {});

// 읽기 사전: "YouTube = 유튜브" per line
let lexicon = [];
async function loadLexicon() {
  lexicon = (await api("GET", "/api/tts/lexicon")).pairs;
  $("lexText").value = lexicon.map(([a, b]) => `${a} = ${b}`).join("\n");
  lineInfo();
}
$("lexSave").addEventListener("click", async () => {
  const pairs = $("lexText").value.split("\n").map(l => l.split("=").map(s => s.trim())).filter(p => p.length === 2 && p[0] && p[1]);
  await api("PUT", "/api/tts/lexicon", { pairs });
  await loadLexicon();
  $("lexSave").textContent = "저장됨 ✓"; setTimeout(() => $("lexSave").textContent = "사전 저장", 1500);
});
loadLexicon().catch(() => {});

// English words that the dictionary doesn't cover read awkwardly — point them out.
function unknownEnglish(text) {
  const known = new Set(lexicon.map(([a]) => a.toLowerCase()));
  const words = text.match(/[A-Za-z][A-Za-z0-9'\-]*/g) || [];
  return [...new Set(words.filter(w => !known.has(w.toLowerCase())))];
}
const genLines = () => $("genText").value.split("\n").map(l => l.trim()).filter(Boolean);
$("genText").value = pref("draft") || "";
$("genText").addEventListener("input", () => { pref("draft", $("genText").value); lineInfo(); });
$("genText").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); generate(); } });

// Seconds of CPU time per character, learned from finished items (first test: ~2.6 s/char).
function secPerChar() {
  const done = genItems.filter(i => i.status === "done" && i.took);
  if (!done.length) return 2.6;
  return done.reduce((a, i) => a + i.took, 0) / done.reduce((a, i) => a + i.text.length, 0);
}
const fmtWait = s => s < 60 ? `${Math.max(1, Math.round(s))}초` : `${Math.round(s / 60)}분`;

function lineInfo() {
  const lines = genLines(), chars = lines.reduce((a, l) => a + l.length, 0);
  $("lineInfo").textContent = lines.length ? `${lines.length}줄 → 파일 ${lines.length}개 · 예상 약 ${fmtWait(chars * secPerChar())}` : "0줄 → 파일 0개";
  const en = unknownEnglish(lines.join(" "));
  if (en.length) {
    const w = document.createElement("div"); w.className = "warn-en";
    w.textContent = `영어 단어 ${en.slice(0, 5).join(", ")}${en.length > 5 ? " 외" : ""} — 읽기 사전에 한글 발음을 넣으면 더 자연스러워요.`;
    $("lineInfo").appendChild(w);
  }
}

function genOpts() {
  return { speed: +$("speed").value, pitch: +$("pitch").value, gap: +$("gap").value, style,
    voice: $("voice").value || "A", denoise: $("denoise").checked, calm_exclaim: $("calm_exclaim").checked };
}

async function generate() {
  const lines = genLines();
  if (!lines.length) { $("genText").focus(); return; }
  $("genBtn").disabled = true;
  try {
    await api("POST", "/api/tts/generate", { text: lines.join("\n"), ...genOpts() });
    $("genText").value = ""; pref("draft", ""); lineInfo();
    await refreshGen();
  } catch (e) { alert("만들기 실패: " + e.message); }
  $("genBtn").disabled = false;
}
$("genBtn").addEventListener("click", generate);

async function refreshGen() {
  let data;
  try { data = await api("GET", "/api/tts/items"); } catch { schedulePoll(5000); return; }
  const prev = new Map(genItems.map(i => [i.id, i.status]));
  genItems = data.items;
  // Auto-play items that finish while the page is open (not ones already done on load).
  if (seen) for (const i of genItems) if (i.status === "done" && prev.get(i.id) && prev.get(i.id) !== "done") queuePlay(i.id);
  seen = true;
  for (const id of [...selected]) if (!genItems.some(i => i.id === id && i.status === "done")) selected.delete(id);
  renderGen(data.model);
  const busy = genItems.some(i => i.status === "queued" || i.status === "generating");
  schedulePoll(busy ? 2000 : null);
}
function schedulePoll(ms) { clearTimeout(pollTimer); if (ms) pollTimer = setTimeout(refreshGen, ms); }

let lastModel = "unloaded";
function renderGen(model = lastModel) {
  lastModel = model;
  const spc = secPerChar();
  const pending = genItems.filter(i => i.status === "queued" || i.status === "generating");
  const waitAll = pending.reduce((a, i) => a + i.text.length * spc, 0);
  $("modelInfo").textContent =
    model === "loading" ? "목소리 모델을 불러오는 중이에요 (처음 한 번, 1~2분)…" :
    model === "error" ? "모델을 불러오지 못했어요. 서버 창의 오류를 확인해 주세요." :
    pending.length ? `${pending.length}개 남음 · 약 ${fmtWait(waitAll)}` : "";
  lineInfo();

  const box = $("items");
  if (!genItems.length) { box.innerHTML = '<div class="empty">아직 만든 음성이 없어요.<br>왼쪽에 글을 넣고 “음성 만들기”를 눌러 보세요.</div>'; }
  else {
    // Keep existing rows (and their playing <audio>) when nothing about them changed.
    const old = new Map([...box.querySelectorAll(".gi")].map(el => [el.dataset.id, el]));
    box.innerHTML = "";
    for (const it of genItems) {
      const sig = `${it.status}|${it.duration}|${selected.has(it.id)}`;
      let el = old.get(it.id);
      if (!el || el.dataset.sig !== sig) el = genRow(it);
      el.dataset.sig = sig;
      box.appendChild(el);
    }
  }
  const doneIds = genItems.filter(i => i.status === "done").map(i => i.id);
  $("selAll").checked = doneIds.length > 0 && doneIds.every(id => selected.has(id));
  $("saveSel").disabled = !selected.size;
  $("delSel").disabled = !selected.size;
  $("saveSel").textContent = selected.size ? `⬇ 선택 저장 (${selected.size})` : "⬇ 선택 저장";
}

function genRow(it) {
  const el = document.createElement("div");
  el.className = "gi"; el.dataset.id = it.id;
  const settings = [`${(+it.speed).toFixed(2)}배`, `높낮이 ${it.pitch > 0 ? "+" : ""}${it.pitch}`,
    it.style ? `억양 ${STYLE_NAMES[it.style] || it.style}` : "", it.gap !== undefined ? `쉼 ${(+it.gap).toFixed(2)}초` : "",
    it.denoise ? "잡음 제거" : "", it.voice ? voiceLabel(it.voice) : ""].filter(Boolean).join(" · ");
  const status = {
    queued: "⏳ 대기 중",
    generating: "🎙 만드는 중…",
    done: `✓ ${it.duration ? it.duration.toFixed(1) + "초" : ""}`,
    error: `<span class="err">오류: ${escapeHtml(it.error || "")}</span>`,
  }[it.status];
  el.innerHTML = `<input type="checkbox" ${it.status === "done" ? "" : "disabled"} ${selected.has(it.id) ? "checked" : ""}>
    <div><div class="txt"></div><div class="meta">${status} · ${settings}</div></div>
    <div class="acts">${it.status === "done" ? '<button data-act="play">▶ 듣기</button>' : ""}
      ${it.status === "error" ? '<button data-act="retry">다시 만들기</button>' : ""}
      ${it.status === "generating" ? "" : '<button data-act="del" title="삭제">✕</button>'}</div>`;
  el.querySelector(".txt").textContent = it.text;
  el.querySelector("input").addEventListener("change", e => { e.target.checked ? selected.add(it.id) : selected.delete(it.id); renderGen(); });
  el.querySelector('[data-act="play"]')?.addEventListener("click", () => playGen(it.id, true));
  el.querySelector('[data-act="del"]')?.addEventListener("click", async () => {
    if (!confirm(`이 음성을 삭제할까요?\n\n${it.text}`)) return;
    await api("POST", "/api/tts/delete", { ids: [it.id] }); selected.delete(it.id); refreshGen();
  });
  el.querySelector('[data-act="retry"]')?.addEventListener("click", async () => {
    await api("POST", "/api/tts/delete", { ids: [it.id] });
    const { id, text, status, created, duration, error, took, ...opts } = it;
    await api("POST", "/api/tts/generate", { text, ...opts }); refreshGen();
  });
  return el;
}
const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function queuePlay(id) { if ($("autoPlay").checked) { playQueue.push(id); if (!genPlayer) playNext(); } }
function playNext() { const id = playQueue.shift(); if (id) playGen(id, false); }
function playGen(id, manual) {
  if (manual) playQueue.length = 0;
  if (genPlayer) genPlayer.pause();
  document.querySelectorAll(".gi.new").forEach(e => e.classList.remove("new"));
  document.querySelector(`.gi[data-id="${id}"]`)?.classList.add("new");
  genPlayer = new Audio(`/api/tts/audio/${id}`);
  genPlayer.onended = () => { genPlayer = null; playNext(); };
  genPlayer.play().catch(() => { genPlayer = null; });
}

$("selAll").addEventListener("change", e => {
  selected = new Set(e.target.checked ? genItems.filter(i => i.status === "done").map(i => i.id) : []);
  renderGen();
});

$("delSel").addEventListener("click", async () => {
  if (!confirm(`선택한 ${selected.size}개를 삭제할까요?`)) return;
  await api("POST", "/api/tts/delete", { ids: [...selected] }); selected.clear(); refreshGen();
});

// File names come from the line itself; strip characters Windows forbids and de-duplicate.
function fileNames(items) {
  const used = new Map();
  return items.map(it => {
    let base = it.text.replace(/[\\/:*?"<>|\x00-\x1f]/g, "").replace(/\s+/g, " ").trim().slice(0, 80).replace(/[. ]+$/, "") || it.id;
    const key = base.toLowerCase(), n = (used.get(key) || 0) + 1;
    used.set(key, n);
    return { id: it.id, name: `${n > 1 ? `${base} (${n})` : base}.wav` };
  });
}

$("saveSel").addEventListener("click", async () => {
  // Keep list order (newest first) reversed so files read in the order the lines were written.
  const files = fileNames(genItems.filter(i => selected.has(i.id)).reverse());
  if (window.showDirectoryPicker) {
    let dir;
    try { dir = await showDirectoryPicker({ id: "myvoice", mode: "readwrite" }); }
    catch { return; }  // user cancelled
    let ok = 0;
    for (const f of files) {
      const blob = await (await fetch(`/api/tts/audio/${f.id}`)).blob();
      const w = await (await dir.getFileHandle(f.name, { create: true })).createWritable();
      await w.write(blob); await w.close(); ok++;
    }
    alert(`${ok}개 파일을 “${dir.name}” 폴더에 저장했어요.`);
  } else {
    const r = await fetch("/api/tts/zip", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ files }) });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await r.blob()); a.download = "my_voice.zip"; a.click();
  }
});

refreshGen();
</script>
</body>
</html>
